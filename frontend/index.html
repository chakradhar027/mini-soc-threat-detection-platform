<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini SOC & Threat Detection Platform</title>
  <!-- Tailwind CSS via CDN for instant local zero-dependency rendering -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            soc: {
              bg: '#0A0E17',
              panel: '#111827',
              card: '#1F2937',
              border: '#374151',
              accent: '#3B82F6',
              danger: '#EF4444',
              warning: '#F59E0B',
              success: '#10B981',
              muted: '#9CA3AF'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0A0E17; color: #F3F4F6; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .nav-btn.active { background-color: #1F2937; color: #3B82F6; border-left: 3px solid #3B82F6; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #111827; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
  </style>
</head>
<body class="flex h-screen overflow-hidden text-sm">

  <!-- ==================== SIDEBAR NAVIGATION ==================== -->
  <aside class="w-64 bg-soc-panel border-r border-soc-border flex flex-col justify-between select-none">
    <div>
      <!-- Header / Logo -->
      <div class="px-5 py-4 border-b border-soc-border flex items-center space-x-3">
        <div class="w-8 h-8 rounded bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-blue-500/30">
          <i data-lucide="shield-alert" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight tracking-wide text-white">MINI SOC</h1>
          <p class="text-xs text-blue-400 font-mono">THREAT DETECTION</p>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="p-3 space-y-1 custom-scroll overflow-y-auto max-h-[calc(100vh-140px)]">
        <button onclick="switchTab('overview')" id="btn-overview" class="nav-btn active w-full flex items-center space-x-3 px-3 py-2 rounded text-left transition hover:bg-soc-card">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span>Overview</span>
        </button>
        <button onclick="switchTab('events')" id="btn-events" class="nav-btn w-full flex items-center space-x-3 px-3 py-2 rounded text-left transition hover:bg-soc-card">
          <i data-lucide="activity" class="w-4 h-4"></i>
          <span>Live Security Events</span>
        </button>
        <button onclick="switchTab('honeypots')" id="btn-honeypots" class="nav-btn w-full flex items-center space-x-3 px-3 py-2 rounded text-left transition hover:bg-soc-card">
          <i data-lucide="radar" class="w-4 h-4"></i>
          <span>Honeypot Monitoring</span>
        </button>
        <button onclick="switchTab('iot')" id="btn-iot" class="nav-btn w-full flex items-center space-x-3 px-3 py-2 rounded text-left transition hover:bg-soc-card">
          <i data-lucide="cpu" class="w-4 h-4"></i>
          <span>IoT Device Fleet (10)</span>
        </button>
        <button onclick="switchTab('alerts')" id="btn-alerts" class="nav-btn w-full flex items-center space-x-3 px-3 py-2 rounded text-left transition hover:bg-soc-card">
          <i data-lucide="bell" class="w-4 h-4"></i>
          <span>Security Alerts</span>
        </button>
        <button onclick="switchTab('incidents')" id="btn-incidents" class="nav-btn w-full flex items-center space-x-3 px-3 py-2 rounded text-left transition hover:bg-soc-card">
          <i data-lucide="search" class="w-4 h-4"></i>
          <span>Incident Workspace</span>
        </button>
        <button onclick="switchTab('threat_intel')" id="btn-threat_intel" class="nav-btn w-full flex items-center space-x-3 px-3 py-2 rounded text-left transition hover:bg-soc-card">
          <i data-lucide="globe" class="w-4 h-4"></i>
          <span>Threat Intelligence</span>
        </button>
        <button onclick="switchTab('mitre')" id="btn-mitre" class="nav-btn w-full flex items-center space-x-3 px-3 py-2 rounded text-left transition hover:bg-soc-card">
          <i data-lucide="grid" class="w-4 h-4"></i>
          <span>MITRE ATT&CK Matrix</span>
        </button>
        <button onclick="switchTab('ml')" id="btn-ml" class="nav-btn w-full flex items-center space-x-3 px-3 py-2 rounded text-left transition hover:bg-soc-card">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
          <span>ML Anomaly Detection</span>
        </button>
        <button onclick="switchTab('response')" id="btn-response" class="nav-btn w-full flex items-center space-x-3 px-3 py-2 rounded text-left transition hover:bg-soc-card">
          <i data-lucide="lock" class="w-4 h-4"></i>
          <span>SOAR Response</span>
        </button>
        <button onclick="switchTab('analytics')" id="btn-analytics" class="nav-btn w-full flex items-center space-x-3 px-3 py-2 rounded text-left transition hover:bg-soc-card">
          <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
          <span>Attack Analytics</span>
        </button>
        <button onclick="switchTab('graph')" id="btn-graph" class="nav-btn w-full flex items-center space-x-3 px-3 py-2 rounded text-left transition hover:bg-soc-card">
          <i data-lucide="share-2" class="w-4 h-4"></i>
          <span>Relationship Graph</span>
        </button>
        <button onclick="switchTab('evidence')" id="btn-evidence" class="nav-btn w-full flex items-center space-x-3 px-3 py-2 rounded text-left transition hover:bg-soc-card">
          <i data-lucide="file-check-2" class="w-4 h-4"></i>
          <span>Evidence Integrity</span>
        </button>
        <button onclick="switchTab('reports')" id="btn-reports" class="nav-btn w-full flex items-center space-x-3 px-3 py-2 rounded text-left transition hover:bg-soc-card">
          <i data-lucide="file-text" class="w-4 h-4"></i>
          <span>Forensic Reports</span>
        </button>
        <button onclick="switchTab('health')" id="btn-health" class="nav-btn w-full flex items-center space-x-3 px-3 py-2 rounded text-left transition hover:bg-soc-card">
          <i data-lucide="heart-pulse" class="w-4 h-4"></i>
          <span>System Health</span>
        </button>
      </nav>
    </div>

    <!-- User / Profile pill -->
    <div class="p-3 border-t border-soc-border bg-soc-panel">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold text-xs text-white">SA</div>
        <div class="overflow-hidden">
          <p class="font-medium text-xs truncate">SOC Lead Analyst</p>
          <p class="text-[10px] text-emerald-400 font-mono">ACTIVE (Apple Silicon)</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- ==================== MAIN CONTENT AREA ==================== -->
  <main class="flex-1 flex flex-col overflow-hidden bg-soc-bg">

    <!-- Top Navbar -->
    <header class="h-14 border-b border-soc-border bg-soc-panel px-6 flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <span id="page-title" class="font-semibold text-base text-white">SOC Overview</span>
        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-emerald-950 text-emerald-400 border border-emerald-800">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>
          REAL-TIME TELEMETRY
        </span>
      </div>

      <div class="flex items-center space-x-3">
        <span class="text-xs text-soc-muted font-mono" id="clock-display">00:00:00 UTC</span>
        <button onclick="refreshData()" class="p-1.5 rounded bg-soc-card hover:bg-soc-border text-soc-muted hover:text-white transition" title="Refresh Telemetry">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
        <span class="px-2.5 py-1 bg-amber-950 border border-amber-800 text-amber-400 text-xs rounded font-mono font-semibold">
          SOAR: SIMULATION
        </span>
      </div>
    </header>

    <!-- Dynamic View Container -->
    <div id="view-container" class="flex-1 p-6 overflow-y-auto custom-scroll space-y-6">
      <!-- Views injected here dynamically by JavaScript -->
    </div>

  </main>

  <!-- ==================== FRONTEND CONTROLLER JAVASCRIPT ==================== -->
  <script>
    const API_BASE = window.location.protocol.startsWith("http")
      ? `${window.location.origin}/api/v1`
      : "http://127.0.0.1:8000/api/v1";
    let currentTab = 'overview';
    let cachedOverview = {};
    let cachedEvents = [];
    let cachedIncidents = [];
    let cachedDevices = [];
    let selectedIncidentId = null;

    // Live UTC Clock
    setInterval(() => {
      document.getElementById('clock-display').innerText = new Date().toUTCString().slice(17, 25) + ' UTC';
    }, 1000);

    function switchTab(tabId) {
      currentTab = tabId;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${tabId}`);
      if (activeBtn) activeBtn.classList.add('active');

      const titles = {
        overview: "Security Operations Center Overview",
        events: "Live Honeypot & IoT Security Events",
        honeypots: "Decoy Honeynet Telemetry & Traps",
        iot: "Virtual IoT Device Simulation Fleet",
        alerts: "Wazuh & Sigma Security Detections",
        incidents: "Incident Investigation & Triage Workspace",
        threat_intel: "Threat Intelligence Indicator Enrichment",
        mitre: "MITRE ATT&CK Enterprise Matrix",
        ml: "Isolation Forest Anomaly Detection Engine",
        response: "SOAR Automated Containment Center",
        analytics: "Attack Traffic & Credential Analytics",
        graph: "Attack Entity Relationship Graph",
        evidence: "Cryptographic Evidence Integrity Attestation",
        reports: "Forensic Incident Investigation Reports",
        health: "System Health & ARM64 Architecture Diagnostics"
      };
      document.getElementById('page-title').innerText = titles[tabId] || "Mini SOC Platform";
      renderView();
    }

    async function fetchAPI(endpoint, options = {}) {
      try {
        const res = await fetch(`${API_BASE}${endpoint}`, options);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (err) {
        console.warn(`API query error (${endpoint}):`, err);
        return null;
      }
    }

    async function refreshData() {
      cachedOverview = await fetchAPI('/overview') || {};
      const evData = await fetchAPI('/events?limit=50') || {};
      cachedEvents = evData.events || [];
      const incData = await fetchAPI('/incidents') || {};
      cachedIncidents = incData.incidents || [];
      const iotData = await fetchAPI('/iot/devices') || {};
      cachedDevices = iotData.devices || [];
      renderView();
    }

    function renderView() {
      const container = document.getElementById('view-container');
      if (currentTab === 'overview') renderOverview(container);
      else if (currentTab === 'events') renderEvents(container);
      else if (currentTab === 'honeypots') renderHoneypots(container);
      else if (currentTab === 'iot') renderIoT(container);
      else if (currentTab === 'alerts') renderAlerts(container);
      else if (currentTab === 'incidents') renderIncidents(container);
      else if (currentTab === 'threat_intel') renderThreatIntel(container);
      else if (currentTab === 'mitre') renderMitre(container);
      else if (currentTab === 'ml') renderML(container);
      else if (currentTab === 'response') renderResponse(container);
      else if (currentTab === 'analytics') renderAnalytics(container);
      else if (currentTab === 'graph') renderGraph(container);
      else if (currentTab === 'evidence') renderEvidence(container);
      else if (currentTab === 'reports') renderReports(container);
      else if (currentTab === 'health') renderHealth(container);
      lucide.createIcons();
    }

    // --- 1. OVERVIEW VIEW ---
    function renderOverview(container) {
      const o = cachedOverview;
      container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="bg-soc-panel border border-soc-border p-4 rounded-lg shadow-sm">
            <div class="flex items-center justify-between text-soc-muted">
              <span class="text-xs uppercase font-medium">Interactions Observed</span>
              <i data-lucide="activity" class="w-4 h-4 text-blue-400"></i>
            </div>
            <div class="mt-2 text-2xl font-bold text-white font-mono">${o.total_interactions || 0}</div>
            <div class="mt-1 text-[11px] text-emerald-400">Captured in persistent logs</div>
          </div>
          <div class="bg-soc-panel border border-soc-border p-4 rounded-lg shadow-sm">
            <div class="flex items-center justify-between text-soc-muted">
              <span class="text-xs uppercase font-medium">Security Alerts</span>
              <i data-lucide="bell" class="w-4 h-4 text-amber-400"></i>
            </div>
            <div class="mt-2 text-2xl font-bold text-amber-400 font-mono">${o.security_alerts || 0}</div>
            <div class="mt-1 text-[11px] text-soc-muted">Wazuh & Sigma Rules</div>
          </div>
          <div class="bg-soc-panel border border-soc-border p-4 rounded-lg shadow-sm">
            <div class="flex items-center justify-between text-soc-muted">
              <span class="text-xs uppercase font-medium">Critical Incidents</span>
              <i data-lucide="alert-octagon" class="w-4 h-4 text-rose-500"></i>
            </div>
            <div class="mt-2 text-2xl font-bold text-rose-500 font-mono">${o.critical_incidents || 0}</div>
            <div class="mt-1 text-[11px] text-rose-400">Requires Analyst Triage</div>
          </div>
          <div class="bg-soc-panel border border-soc-border p-4 rounded-lg shadow-sm">
            <div class="flex items-center justify-between text-soc-muted">
              <span class="text-xs uppercase font-medium">Unique Attacker IPs</span>
              <i data-lucide="globe" class="w-4 h-4 text-cyan-400"></i>
            </div>
            <div class="mt-2 text-2xl font-bold text-cyan-400 font-mono">${o.unique_source_ips || 0}</div>
            <div class="mt-1 text-[11px] text-soc-muted">Enriched via Threat Intel</div>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 bg-soc-panel border border-soc-border rounded-lg p-5">
            <div class="flex items-center justify-between pb-3 border-b border-soc-border">
              <h3 class="font-semibold text-white">Recent Attack Activity Stream</h3>
              <span class="text-xs text-soc-muted">Latest 5 events</span>
            </div>
            <div class="mt-4 space-y-3">
              ${(cachedEvents.slice(0, 5)).map(e => `
                <div class="flex items-center justify-between p-3 rounded bg-soc-card border border-soc-border">
                  <div class="flex items-center space-x-3">
                    <span class="px-2 py-0.5 rounded text-[10px] font-bold ${
                      e.severity === 'CRITICAL' ? 'bg-rose-950 text-rose-400 border border-rose-800' :
                      e.severity === 'HIGH' ? 'bg-amber-950 text-amber-400 border border-amber-800' :
                      'bg-slate-800 text-slate-300'
                    }">${e.severity}</span>
                    <div>
                      <p class="font-mono text-xs text-white">${e.event_type} (${e.source_service})</p>
                      <p class="text-[11px] text-soc-muted font-mono">Source IP: ${e.source_ip} | Port: ${e.destination_port}</p>
                    </div>
                  </div>
                  <span class="text-[11px] text-soc-muted font-mono">${(e.timestamp || '').slice(11, 19)} UTC</span>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="bg-soc-panel border border-soc-border rounded-lg p-5">
            <h3 class="font-semibold text-white pb-3 border-b border-soc-border">Honeynet Target Distribution</h3>
            <div class="mt-4 space-y-3">
              <div>
                <div class="flex justify-between text-xs mb-1">
                  <span class="text-soc-muted">Cowrie SSH/Telnet (2222/2223)</span>
                  <span class="font-mono text-blue-400">ACTIVE</span>
                </div>
                <div class="w-full bg-soc-card rounded-full h-2">
                  <div class="bg-blue-500 h-2 rounded-full" style="width: 65%"></div>
                </div>
              </div>
              <div>
                <div class="flex justify-between text-xs mb-1">
                  <span class="text-soc-muted">Dionaea SMB/HTTP/FTP</span>
                  <span class="font-mono text-emerald-400">ACTIVE</span>
                </div>
                <div class="w-full bg-soc-card rounded-full h-2">
                  <div class="bg-emerald-500 h-2 rounded-full" style="width: 25%"></div>
                </div>
              </div>
              <div>
                <div class="flex justify-between text-xs mb-1">
                  <span class="text-soc-muted">Mosquitto MQTT Honey (18883)</span>
                  <span class="font-mono text-amber-400">ACTIVE</span>
                </div>
                <div class="w-full bg-soc-card rounded-full h-2">
                  <div class="bg-amber-500 h-2 rounded-full" style="width: 10%"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // --- 2. LIVE EVENTS VIEW ---
    function renderEvents(container) {
      container.innerHTML = `
        <div class="bg-soc-panel border border-soc-border rounded-lg p-5 space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="font-semibold text-white">Security Events Stream (${cachedEvents.length})</h3>
            <div class="flex items-center space-x-2">
              <span class="text-xs text-soc-muted">Filter:</span>
              <button onclick="refreshData()" class="px-2 py-1 bg-soc-card text-xs rounded text-soc-muted hover:text-white">All</button>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left font-mono text-xs">
              <thead class="bg-soc-card text-soc-muted uppercase text-[10px] border-b border-soc-border">
                <tr>
                  <th class="p-3">Timestamp (UTC)</th>
                  <th class="p-3">Severity</th>
                  <th class="p-3">Source IP</th>
                  <th class="p-3">Service</th>
                  <th class="p-3">Event Type</th>
                  <th class="p-3">Target User</th>
                  <th class="p-3">Payload / Input Preview</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-soc-border">
                ${cachedEvents.map(e => `
                  <tr class="hover:bg-soc-card/50 transition">
                    <td class="p-3 text-soc-muted">${(e.timestamp || '').slice(0, 19).replace('T', ' ')}</td>
                    <td class="p-3">
                      <span class="px-2 py-0.5 rounded text-[10px] font-bold ${
                        e.severity === 'CRITICAL' ? 'bg-rose-950 text-rose-400 border border-rose-800' :
                        e.severity === 'HIGH' ? 'bg-amber-950 text-amber-400 border border-amber-800' :
                        e.severity === 'MEDIUM' ? 'bg-yellow-950 text-yellow-400 border border-yellow-800' :
                        'bg-slate-800 text-slate-400'
                      }">${e.severity}</span>
                    </td>
                    <td class="p-3 text-cyan-400 font-semibold">${e.source_ip}</td>
                    <td class="p-3 text-soc-muted">${e.source_service}</td>
                    <td class="p-3 text-white font-medium">${e.event_type}</td>
                    <td class="p-3 text-amber-300">${e.username || '-'}</td>
                    <td class="p-3 text-slate-400 truncate max-w-xs">${e.metadata?.input || e.metadata?.payload || e.raw_event?.slice(0, 60) || '-'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // --- 3. HONEYPOTS VIEW ---
    function renderHoneypots(container) {
      container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="bg-soc-panel border border-soc-border rounded-lg p-5">
            <div class="flex items-center justify-between pb-3 border-b border-soc-border">
              <h4 class="font-bold text-white text-base">Cowrie Honeypot</h4>
              <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-emerald-950 text-emerald-400 border border-emerald-800">LISTENING</span>
            </div>
            <div class="mt-4 space-y-2 text-xs">
              <p><span class="text-soc-muted">Protocols:</span> <span class="font-mono text-white">SSH-2.0, Telnet</span></p>
              <p><span class="text-soc-muted">Target Ports:</span> <span class="font-mono text-cyan-400">2222, 2223</span></p>
              <p><span class="text-soc-muted">Emulated OS:</span> <span class="font-mono text-white">Ubuntu 22.04 LTS</span></p>
              <p><span class="text-soc-muted">Log Destination:</span> <span class="font-mono text-slate-400">volumes/cowrie/log/cowrie.json</span></p>
            </div>
          </div>
          <div class="bg-soc-panel border border-soc-border rounded-lg p-5">
            <div class="flex items-center justify-between pb-3 border-b border-soc-border">
              <h4 class="font-bold text-white text-base">Dionaea Malware Trap</h4>
              <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-emerald-950 text-emerald-400 border border-emerald-800">LISTENING</span>
            </div>
            <div class="mt-4 space-y-2 text-xs">
              <p><span class="text-soc-muted">Protocols:</span> <span class="font-mono text-white">SMB, HTTP, FTP, TFTP</span></p>
              <p><span class="text-soc-muted">Target Ports:</span> <span class="font-mono text-cyan-400">4445, 8081, 2121</span></p>
              <p><span class="text-soc-muted">Payload Capture:</span> <span class="font-mono text-white">SHA-256 / MD5 hashing</span></p>
              <p><span class="text-soc-muted">Log Destination:</span> <span class="font-mono text-slate-400">volumes/dionaea/log/dionaea.json</span></p>
            </div>
          </div>
          <div class="bg-soc-panel border border-soc-border rounded-lg p-5">
            <div class="flex items-center justify-between pb-3 border-b border-soc-border">
              <h4 class="font-bold text-white text-base">Mosquitto MQTT Honey</h4>
              <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-emerald-950 text-emerald-400 border border-emerald-800">LISTENING</span>
            </div>
            <div class="mt-4 space-y-2 text-xs">
              <p><span class="text-soc-muted">Protocols:</span> <span class="font-mono text-white">MQTT 3.1.1</span></p>
              <p><span class="text-soc-muted">Target Ports:</span> <span class="font-mono text-cyan-400">18883</span></p>
              <p><span class="text-soc-muted">Detection:</span> <span class="font-mono text-white">Wildcards (#), Rogue publish</span></p>
              <p><span class="text-soc-muted">Log Destination:</span> <span class="font-mono text-slate-400">volumes/mosquitto/log/mqtt_honey.json</span></p>
            </div>
          </div>
        </div>
      `;
    }

    // --- 4. IOT DEVICE FLEET VIEW ---
    function renderIoT(container) {
      container.innerHTML = `
        <div class="bg-soc-panel border border-soc-border rounded-lg p-5 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="font-semibold text-white">Simulated IoT Edge Fleet (10 Devices)</h3>
              <p class="text-xs text-soc-muted">Asynchronous virtual telemetry publishing to isolated MQTT broker.</p>
