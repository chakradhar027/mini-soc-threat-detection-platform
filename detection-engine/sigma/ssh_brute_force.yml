title: Repeated SSH Authentication Failures on Honeypot
id: sig-mini-soc-001
status: production
description: Detects multiple failed authentication attempts originating from the same source IP within a 60-second window on the Cowrie SSH honeypot.
author: Mini SOC Detection Engineering Team
date: 2026-11-08
references:
  - https://attack.mitre.org/techniques/T1110/001/
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  category: honeypot
  product: cowrie
  service: ssh
detection:
  selection:
    eventid: cowrie.login.failed
  timeframe: 60s
  condition: selection | count(src_ip) >= 5
fields:
  - src_ip
  - username
  - password
  - session
falsepositives:
  - Authorized internal penetration testing (low probability on honeynet)
level: high

