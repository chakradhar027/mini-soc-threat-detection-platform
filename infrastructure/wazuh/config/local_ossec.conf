<!--
  Wazuh Local Configuration Snippet for Mini SOC Honeynet & IoT Fleet
  Specifies local log collection targets for Cowrie, Dionaea, and Mosquitto.
-->
<ossec_config>
  <!-- Cowrie SSH/Telnet JSON Log Collector -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/honeypots/cowrie/cowrie.json</location>
  </localfile>

  <!-- Dionaea Multi-Service Trap JSON Log Collector -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/honeypots/dionaea/dionaea.json</location>
  </localfile>

  <!-- Mosquitto IoT Telemetry JSON Log Collector -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/honeypots/mosquitto/iot_telemetry.json</location>
  </localfile>

  <!-- MQTT Honeypot JSON Log Collector -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/honeypots/mosquitto/mqtt_honey.json</location>
  </localfile>
</ossec_config>
