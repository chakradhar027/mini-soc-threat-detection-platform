services:
  # =========================================================================
  # POSTGRESQL RELATIONAL STORE
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: soc-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mini_soc}
    volumes:
      - ../../infrastructure/docker/volumes/postgres/data:/var/lib/postgresql/data
    networks:
      soc-mgmt-net:
        ipv4_address: 172.28.30.40
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_admin} -d ${POSTGRES_DB:-mini_soc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 128M

  # =========================================================================
  # FASTAPI SOC BACKEND CORE & ML ENGINE
  # =========================================================================
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: mini-soc/backend:latest
    container_name: soc-fastapi-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../../.env
    volumes:
      - ../../backend:/app
      - ../../infrastructure/docker/volumes/cowrie/log:/var/log/honeypots/cowrie:ro
      - ../../infrastructure/docker/volumes/dionaea/log:/var/log/honeypots/dionaea:ro
      - ../../infrastructure/docker/volumes/mosquitto/log:/var/log/honeypots/mosquitto:ro
      - ../../reports:/app/reports
    networks:
      soc-mgmt-net:
        ipv4_address: 172.28.30.50
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          memory: 256M

  # =========================================================================
  # REACT SOC ANALYST DASHBOARD
  # =========================================================================
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: mini-soc/frontend:latest
    container_name: soc-react-dashboard
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
    networks:
      soc-mgmt-net:
        ipv4_address: 172.28.30.60
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          memory: 64M

  # =========================================================================
  # GRAFANA ANALYTICS
  # =========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: soc-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../../infrastructure/docker/volumes/grafana/data:/var/lib/grafana
    networks:
      soc-mgmt-net:
        ipv4_address: 172.28.30.70
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 128M

networks:
  soc-mgmt-net:
    name: soc-mgmt-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.30.0/24
          gateway: 172.28.30.1

